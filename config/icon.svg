<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FA8D9"/><stop offset="1" stop-color="#2B5F8E"/>
    </linearGradient>
    <linearGradient id="gy" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE873"/><stop offset="1" stop-color="#E8B62B"/>
    </linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F8"/><stop offset="0.45" stop-color="#C6CDD6"/><stop offset="1" stop-color="#8D97A3"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#227449"/><stop offset="1" stop-color="#123b25"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="42" fill="url(#bg)"/>
  <rect x="7" y="7" width="242" height="242" rx="36" fill="none" stroke="#2E7A4E" stroke-width="1.5" opacity="0.5"/>

  <!-- single mounting hole, top-left only: doubles as a PCB pin-1 / orientation marker -->
  <g>
    <circle cx="30" cy="30" r="10.5" fill="none" stroke="#2E7A4E" stroke-width="1.2" opacity="0.6"/>
    <circle cx="30" cy="30" r="8" fill="url(#gp)"/>
    <circle cx="30" cy="30" r="3.6" fill="#123b25"/>
  </g>

  <g fill="url(#gp)">
    <rect x="56.50" y="13.00" width="11.0" height="40.0" rx="3"/>
    <rect x="56.50" y="203.00" width="11.0" height="40.0" rx="3"/>
    <rect x="25.00" y="56.50" width="40.0" height="11.0" rx="3"/>
    <rect x="191.00" y="56.50" width="40.0" height="11.0" rx="3"/>
    <rect x="89.50" y="13.00" width="11.0" height="40.0" rx="3"/>
    <rect x="89.50" y="203.00" width="11.0" height="40.0" rx="3"/>
    <rect x="25.00" y="89.50" width="40.0" height="11.0" rx="3"/>
    <rect x="191.00" y="89.50" width="40.0" height="11.0" rx="3"/>
    <rect x="122.50" y="13.00" width="11.0" height="40.0" rx="3"/>
    <rect x="122.50" y="203.00" width="11.0" height="40.0" rx="3"/>
    <rect x="25.00" y="122.50" width="40.0" height="11.0" rx="3"/>
    <rect x="191.00" y="122.50" width="40.0" height="11.0" rx="3"/>
    <rect x="155.50" y="13.00" width="11.0" height="40.0" rx="3"/>
    <rect x="155.50" y="203.00" width="11.0" height="40.0" rx="3"/>
    <rect x="25.00" y="155.50" width="40.0" height="11.0" rx="3"/>
    <rect x="191.00" y="155.50" width="40.0" height="11.0" rx="3"/>
    <rect x="188.50" y="13.00" width="11.0" height="40.0" rx="3"/>
    <rect x="188.50" y="203.00" width="11.0" height="40.0" rx="3"/>
    <rect x="25.00" y="188.50" width="40.0" height="11.0" rx="3"/>
    <rect x="191.00" y="188.50" width="40.0" height="11.0" rx="3"/>
  </g>

  <!-- blue half: arm pulled down to y=108 so the head covers both pad rows on that side -->
  <path id="pb" d="M 40 46 A 18 18 0 0 1 58 28 L 198 28 A 18 18 0 0 1 216 46 L 216 134 A 18 18 0 0 1 198 140 L 137 140 L 131 134 L 131 114 L 125 108 L 58 108 A 18 18 0 0 1 40 90 Z" fill="url(#gb)"/>
  <!-- yellow half: both corners are the 180-degree rotation of blue's two corners about the icon center; stem gap widened slightly (4 to 6 units) -->
  <path id="py" d="M 216 210 A 18 18 0 0 1 198 228 L 58 228 A 18 18 0 0 1 40 210 L 40 122 A 18 18 0 0 1 58 116 L 119 116 L 125 122 L 125 142 L 131 148 L 198 148 A 18 18 0 0 1 216 166 Z" fill="url(#gy)"/>

  <!-- pads (square, not round, to read as chip/LED pads rather than a snake's eyes) -->
  <rect x="63" y="55" width="18" height="18" rx="4" fill="#0A2E1C" opacity="0.9"/>
  <rect x="67.4" y="59.4" width="9.2" height="9.2" rx="2" fill="#FFE873"/>
  <rect x="175" y="183" width="18" height="18" rx="4" fill="#0A2E1C" opacity="0.9"/>
  <rect x="179.4" y="187.4" width="9.2" height="9.2" rx="2" fill="#5FA8D9"/>

  <use href="#pb" fill="none" stroke="#0A2E1C" stroke-width="1" opacity="0.35"/>
  <use href="#py" fill="none" stroke="#0A2E1C" stroke-width="1" opacity="0.35"/>
</svg>
